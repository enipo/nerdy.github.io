<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:none;font-smooth:never}
:root{
  --paper:#ffffff;
  --ink:#000000;
  --desktop:#aaaaaa;
}
html,body{
  background:var(--desktop);
  /* dot pattern Mac System 1-6 */
  background-image:
    radial-gradient(circle at 0 0, #888 1px, transparent 1.5px),
    radial-gradient(circle at 1px 1px, #888 1px, transparent 1.5px);
  background-size:2px 2px;
  font-family:'Chicago',-apple-system,'Lucida Grande','Geneva',sans-serif;
  color:var(--ink);
  min-height:100vh;
  padding-top:24px;
}
/* menubar */
.menubar{position:fixed;top:0;left:0;right:0;height:22px;background:#fff;border-bottom:1px solid #000;display:flex;align-items:center;padding:0 8px;font-size:13px;z-index:100;letter-spacing:.04em}
.menubar .apple{font-size:14px;margin-right:14px;cursor:default}
.menubar .item{margin-right:16px;cursor:default;padding:2px 4px;border-radius:1px}
.menubar .item:hover{background:#000;color:#fff}
.menubar .clock{margin-left:auto;font-size:12px;letter-spacing:.05em}
/* desktop icons */
.icons{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:18px;max-width:880px;margin:14px auto;padding:0 16px}
.ico{display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center;width:80px;justify-self:center}
.ico .pic{width:48px;height:48px;background:#fff;border:1px solid #000;display:flex;align-items:center;justify-content:center;margin-bottom:4px;position:relative}
.ico .label{font-size:11px;background:#fff;padding:1px 4px;border-radius:1px;line-height:1.2;max-width:90px}
.ico:hover .label{background:#000;color:#fff}
.ico.disk .pic{background:repeating-linear-gradient(0deg,#fff 0 4px,#ddd 4px 5px)}
.ico .pic svg{width:36px;height:36px}
/* windows */
.win{position:absolute;background:#fff;border:1px solid #000;box-shadow:1px 1px 0 #000;min-width:280px;max-width:560px;width:90vw}
.titlebar{height:18px;border-bottom:1px solid #000;display:flex;align-items:center;padding:0 4px;background:repeating-linear-gradient(0deg,#000 0 1px,#fff 1px 3px);position:relative;cursor:move;user-select:none}
.titlebar .close{width:11px;height:11px;border:1px solid #000;background:#fff;cursor:pointer;flex-shrink:0}
.titlebar .close:hover{background:#000}
.titlebar h2{flex:1;text-align:center;background:#fff;padding:0 8px;font-size:12px;font-weight:normal;letter-spacing:.04em;margin:0 6px}
.titlebar .stripe-spacer{width:11px}
.win-body{padding:12px 14px 14px;font-size:12px;line-height:1.5;max-height:60vh;overflow-y:auto;background:#fff}
.win-body h3{font-size:13px;margin:8px 0 4px;letter-spacing:.04em}
.win-body p{margin-bottom:6px}
.win-body ul{padding-left:18px;margin-bottom:6px}
.win-body li{margin-bottom:2px}
.win-body a{color:#000;text-decoration:underline}
.win-body .row2{display:flex;gap:10px;margin-bottom:6px;align-items:flex-start}
.win-body .pic-sm{width:32px;height:32px;border:1px solid #000;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff}
.win-body .pic-sm svg{width:24px;height:24px}
.win-body .meta{font-size:11px;color:#444;margin-bottom:6px}
.btn{display:inline-block;border:1px solid #000;background:#fff;padding:2px 12px;font-size:12px;font-family:inherit;cursor:pointer;border-radius:8px;box-shadow:1px 1px 0 #000;letter-spacing:.04em;margin-top:6px}
.btn:active{transform:translate(1px,1px);box-shadow:none}
.alert{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border:2px solid #000;padding:14px 18px;width:280px;text-align:center;z-index:200;box-shadow:3px 3px 0 #000;display:none}
.alert.show{display:block}
.alert .ico-bomb{font-size:28px;margin-bottom:6px}
.dim{color:#666}
.kbd{font-family:Monaco,'Courier New',monospace;font-size:11px;background:#eee;padding:0 4px;border:1px solid #999}
.divider{border-top:1px dashed #000;margin:8px 0}
.trash{position:fixed;bottom:14px;right:14px;display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center}
.trash svg{width:36px;height:48px}
.trash .label{font-size:11px;background:#fff;padding:1px 4px;margin-top:2px}
@media (max-width:520px){
  .win{position:relative!important;left:auto!important;top:auto!important;margin:14px auto;width:94vw}
  .icons{grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:12px}
}
.toolbar{font-size:11px;color:#444;border-bottom:1px solid #000;padding:3px 8px;background:#fff}
</style>

<script>
(function(){
  const windows=document.getElementById('windows');
  let z=10;
  function clock(){
    const d=new Date();
    const h=d.getHours()%12||12, m=String(d.getMinutes()).padStart(2,'0');
    const ap=d.getHours()<12?'AM':'PM';
    const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
    document.getElementById('clk').textContent=day+' '+h+':'+m+' '+ap;
  }
  clock(); setInterval(clock,30000);

  function open(id){
    // close existing of same id
    const existing=windows.querySelector('.win[data-id="'+id+'"]');
    if(existing){ bring(existing); return; }
    const tpl=document.getElementById('tpl-'+id);
    if(!tpl) return;
    const node=tpl.content.firstElementChild.cloneNode(true);
    node.dataset.id=id;
    // offset
    const count=windows.children.length;
    const baseTop=parseInt(node.style.top||'80');
    const baseLeft=parseInt(node.style.left||'120');
    node.style.top=(baseTop+count*16)+'px';
    node.style.left=(baseLeft+count*16)+'px';
    node.style.zIndex=++z;
    windows.appendChild(node);
    bind(node);
  }
  function bring(n){ n.style.zIndex=++z; }

  function bind(node){
    const close=node.querySelector('.close');
    if(close) close.addEventListener('click',()=>node.remove());
    node.querySelectorAll('.close-btn').forEach(b=>b.addEventListener('click',()=>node.remove()));
    node.addEventListener('mousedown',()=>bring(node),true);
    // drag
    const tb=node.querySelector('.titlebar');
    let drag=null;
    function start(e){
      const ev=e.touches?e.touches[0]:e;
      const r=node.getBoundingClientRect();
      drag={dx:ev.clientX-r.left,dy:ev.clientY-r.top};
      e.preventDefault();
    }
    function move(e){
      if(!drag)return;
      const ev=e.touches?e.touches[0]:e;
      node.style.left=(ev.clientX-drag.dx)+'px';
      node.style.top=(ev.clientY-drag.dy)+'px';
    }
    function end(){drag=null}
    tb.addEventListener('mousedown',start);
    tb.addEventListener('touchstart',start,{passive:false});
    document.addEventListener('mousemove',move);
    document.addEventListener('touchmove',move,{passive:false});
    document.addEventListener('mouseup',end);
    document.addEventListener('touchend',end);
  }

  document.querySelectorAll('[data-win]').forEach(el=>{
    el.addEventListener('dblclick',()=>open(el.dataset.win));
    el.addEventListener('click',()=>{
      // touch / single-click also opens for accessibility
      if(window.matchMedia('(hover:none)').matches) open(el.dataset.win);
    });
  });
  // open readme on first load
  open('readme');
})();
</script>

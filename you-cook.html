<!doctype html>
<html lang="en">
<head>
<!-- ontwerp: NERDY (04) — projectpagina-sjabloon: de opbouw van Mission Control (landschap met opkomende planeet, echte schermopnames en screenshot-tour, features, architectuurschema) in de Hologram-stijl van de homepage; alle projectcontent staat in één datablok bovenin <body>. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You Cook · NERDY</title>
<meta name="description" content="You Cook: a cooking game for the family. Chop, cook and serve before the customers run out of patience, while fires, breakdowns and a kitchen cat add to the chaos.">
<meta name="theme-color" content="#05050a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eeebf3" media="(prefers-color-scheme: light)">
<link rel="icon" href="assets/you-cook/yc-icon.webp">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('nerdy-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&family=Schibsted+Grotesk:wght@400..700&family=Martian+Mono:wdth,wght@75..112.5,300..600&display=swap" rel="stylesheet">
<style>
  /* ═════════════ Site tokens (identical to index.html) ═════════════ */
  :root {
    --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
    --font: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sys: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
    --term: 'SF Mono', ui-monospace, Menlo, 'JetBrains Mono', monospace;
    --ease: cubic-bezier(.2, .7, .1, 1);
    --r: 22px;
    --pad: clamp(20px, 4vw, 56px);
    --max: 1240px;
    --claude: #d9774f;
  }
  [data-theme='dark'] {
    --bg: #05050a; --bg-2: #0b0a14; --bg-3: #12111d;
    --text: #efeef8; --muted: #a3a1b8; --faint: #6d6b84;
    --line: rgba(255, 255, 255, .085); --line-2: rgba(255, 255, 255, .16);
    --glass: rgba(255, 255, 255, .035); --glass-2: rgba(255, 255, 255, .065); --edge: rgba(255, 255, 255, .07);
    --shadow: 0 40px 90px -30px rgba(0, 0, 0, .9);
    --holo: linear-gradient(100deg, #7cf4ff 0%, #a98bff 26%, #ff8fd8 50%, #ffd89a 74%, #7cf4ff 100%);
    --cyan: #7cf4ff; --violet: #a98bff; --rose: #ff8fd8; --gold: #ffd89a;
    --orange: #ff9a3c;
    --ok: #5fe6c5; --warn: #ffc257; --err: #ff6b8f; --work: #a98bff; --idle: #7d7b95;
    --btn-bg: #efeef8; --btn-fg: #07060d;
    --codex: #e8e8ef; --on-codex: #111;
    --term-bg: #07070c; --term-fg: #d9d7e8;
    color-scheme: dark;
  }
  [data-theme='light'] {
    --bg: #eeebf3; --bg-2: #f6f4fa; --bg-3: #ffffff;
    --text: #15131e; --muted: #54506a; --faint: #8a86a1;
    --line: rgba(45, 30, 95, .1); --line-2: rgba(45, 30, 95, .2);
    --glass: rgba(255, 255, 255, .52); --glass-2: rgba(255, 255, 255, .78); --edge: rgba(255, 255, 255, .95);
    --shadow: 0 34px 70px -30px rgba(76, 52, 150, .32), 0 2px 8px rgba(76, 52, 150, .06);
    --holo: linear-gradient(100deg, #1397ae 0%, #5d47f0 26%, #c93a97 50%, #c47a12 74%, #1397ae 100%);
    --cyan: #0e8fa6; --violet: #5d47f0; --rose: #c93a97; --gold: #b86e0c;
    --orange: #c45c00;
    --ok: #0d8f70; --warn: #a86a00; --err: #cc3560; --work: #5d47f0; --idle: #8a86a1;
    --btn-bg: #15131e; --btn-fg: #f6f4fa;
    --codex: #26252f; --on-codex: #fff;
    --term-bg: #1a1826; --term-fg: #e9e6f5;
    color-scheme: light;
  }
  /* Project accent: set from the project data block (--p-accent-dark / --p-accent-light). */
  [data-theme='dark'] { --accent: var(--p-accent-dark, var(--violet)); }
  [data-theme='light'] { --accent: var(--p-accent-light, var(--violet)); }

  /* ═════════════ Base (identical to index.html) ═════════════ */
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 17px/1.6 var(--font); -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background-color .6s var(--ease), color .6s var(--ease); }
  [data-theme='light'] body {
    background:
      radial-gradient(60vw 40vw at 90% 160vh, rgba(160, 220, 235, .35), transparent 60%),
      radial-gradient(50vw 40vw at 5% 260vh, rgba(210, 190, 255, .35), transparent 60%),
      radial-gradient(60vw 50vw at 80% 380vh, rgba(255, 205, 230, .3), transparent 60%),
      var(--bg);
  }
  [data-theme='dark'] body {
    background:
      radial-gradient(50vw 40vw at 10% 160vh, rgba(120, 90, 255, .08), transparent 60%),
      radial-gradient(50vw 40vw at 90% 300vh, rgba(80, 220, 255, .06), transparent 60%),
      var(--bg);
  }
  a { color: inherit; }
  img { max-width: 100%; display: block; }
  ::selection { background: var(--violet); color: var(--bg); }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
  code { font-family: var(--term); font-size: .88em; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--glass-2); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); }
  .mono { font-family: var(--mono); font-variation-settings: 'wdth' 90; letter-spacing: .02em; }
  .holo-text { background: var(--holo); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: holoShift 9s linear infinite; }
  @keyframes holoShift { to { background-position: 300% 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ping { to { transform: scale(2); opacity: 0; } }
  @keyframes led { 50% { opacity: .45; } }
  h1, h2, h3, p { margin: 0; }
  section { position: relative; }

  /* nav (identical to index.html) */
  .nav { position: fixed; inset: 0 0 auto 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px var(--pad); transition: background-color .4s, backdrop-filter .4s, border-color .4s; border-bottom: 1px solid transparent; }
  .nav.scrolled { background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-bottom-color: var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 800 17px/1 var(--display); letter-spacing: .06em; }
  .brand-orb { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--rose), var(--gold), var(--cyan)); animation: spin 6s linear infinite; box-shadow: 0 0 18px -2px var(--violet); }
  .brand-orb::after { content: ''; display: block; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), transparent 45%); }
  .nav-links { display: flex; align-items: center; gap: 6px; }
  .nav-links a { text-decoration: none; font-size: 14px; color: var(--muted); padding: 8px 12px; border-radius: 999px; transition: color .2s, background-color .2s; }
  .nav-links a:hover { color: var(--text); background: var(--glass-2); }
  .nav-links a[aria-current='page'] { color: var(--text); background: var(--glass-2); box-shadow: inset 0 0 0 1px var(--line); }
  .theme-toggle { position: relative; width: 64px; height: 32px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--glass); cursor: pointer; padding: 0; flex: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .theme-toggle svg { position: absolute; top: 7px; width: 16px; height: 16px; color: var(--faint); transition: color .3s; }
  .theme-toggle .sun { left: 8px; } .theme-toggle .moon { right: 8px; }
  .theme-toggle .knob { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: conic-gradient(from 200deg, var(--cyan), var(--violet), var(--rose), var(--gold), var(--cyan)); box-shadow: 0 2px 10px -2px var(--violet), inset 0 0 0 2px rgba(255,255,255,.5); transition: transform .5s var(--ease); }
  [data-theme='dark'] .theme-toggle .knob { transform: translateX(32px) rotate(180deg); }
  [data-theme='light'] .theme-toggle .sun, [data-theme='dark'] .theme-toggle .moon { color: transparent; }

  /* buttons, labels, glass (identical to index.html) */
  .btn { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 22px; border-radius: 999px; font: 600 15px/1 var(--font); text-decoration: none; cursor: pointer; border: 0; transition: transform .3s var(--ease), box-shadow .3s var(--ease), background-color .3s; }
  .btn svg { width: 18px; height: 18px; transition: transform .3s var(--ease); }
  .btn:hover svg { transform: translateX(3px); }
  .btn-primary { background: var(--btn-bg); color: var(--btn-fg); box-shadow: 0 10px 30px -10px var(--accent); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -12px var(--accent); }
  .btn-ghost { background: var(--glass); color: var(--text); border: 1px solid var(--line-2); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .btn-ghost:hover { background: var(--glass-2); transform: translateY(-2px); }
  .btn.sm { height: 36px; padding: 0 14px; font-size: 13px; }
  .label { display: inline-flex; align-items: center; gap: 12px; font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .label::before { content: ''; width: 28px; height: 1px; background: var(--holo); }
  .h-sec { margin: 18px 0 0; font: 500 clamp(32px, 4.8vw, 66px)/1.03 var(--display); letter-spacing: -.03em; max-width: 16ch; }
  .glass { position: relative; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow), inset 0 1px 0 var(--edge); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); }
  .foil::before { content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none; background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), var(--cyan), var(--violet) 25%, var(--rose) 45%, transparent 70%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); opacity: .45; transition: opacity .4s; }
  .foil:hover::before { opacity: 1; }

  /* footer (identical to index.html) */
  footer { position: relative; padding: 40px 0 36px; overflow: hidden; border-top: 1px solid var(--line); }
  .foot-mark { font: 900 clamp(60px, 17.5vw, 250px)/.8 var(--display); letter-spacing: -.05em; margin: 0 0 24px -.04em; background: var(--holo); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; opacity: .9; background-position: var(--fx, 50%) 0; user-select: none; }
  .foot-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; font: 500 11px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .foot-row a { text-decoration: none; color: var(--muted); }
  .foot-row a:hover { color: var(--text); }
  .foot-row nav { display: flex; gap: 20px; flex-wrap: wrap; }

  /* ═════════════ Project page template ═════════════ */
  .sec { padding: clamp(80px, 11vw, 150px) 0; }
  .sec-head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; margin-bottom: clamp(32px, 5vw, 56px); }
  .sec-head .idx { font: 500 10.5px/1.6 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); text-align: right; }
  .sec-head p { max-width: 40em; margin-top: 18px; color: var(--muted); font-size: 18px; }

  /* hero: landscape with a rising planet */
  .hero { position: relative; min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
  .hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 72%, transparent) 30%, transparent 56%, transparent 80%, var(--bg) 100%); }
  .hero-inner { position: relative; z-index: 2; padding-top: clamp(116px, 17vh, 176px); display: grid; grid-template-columns: auto 1fr; gap: clamp(22px, 3vw, 44px); align-items: start; }
  .hero-icon { position: relative; width: clamp(84px, 10vw, 132px); }
  .hero-icon img { width: 100%; height: auto; filter: drop-shadow(0 18px 34px color-mix(in srgb, var(--accent) 40%, transparent)); }
  .hero-icon::before { content: ''; position: absolute; inset: -16px; border-radius: 50%; padding: 1.5px; background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--rose), var(--gold), var(--cyan)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); opacity: .6; animation: spin 16s linear infinite; }
  .hero-icon::after { content: ''; position: absolute; inset: -30px; border: 1px dashed var(--line-2); border-radius: 50%; animation: spin 40s linear infinite reverse; }
  .crumb { display: inline-flex; align-items: center; gap: 8px; font: 500 13.5px/1 var(--font); color: var(--muted); text-decoration: none; }
  .crumb svg { width: 15px; height: 15px; transition: transform .25s var(--ease); }
  .crumb:hover { color: var(--text); } .crumb:hover svg { transform: translateX(-3px); }
  .hero .eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 18px; font: 500 11px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 26px; padding: 0 11px; border-radius: 999px; font: 500 10.5px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); }
  .chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: led 1.6s ease-in-out infinite; }
  .hero h1 { margin: 16px 0 0; font: 600 clamp(40px, 6.6vw, 100px)/.95 var(--display); letter-spacing: -.04em; }
  .hero h1 .word { white-space: nowrap; }
  .hero h1 .ch { display: inline-block; animation: weightIn 1.6s cubic-bezier(.16, 1, .3, 1) backwards; }
  /* The intro only morphs weight, so the title is readable from the first paint. */
  @keyframes weightIn { from { font-weight: 200; } }
  .hero h1 .tail { background: linear-gradient(120deg, var(--accent), var(--gold) 45%, var(--rose)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .tagline { display: block; margin-top: 18px; font: 500 clamp(20px, 2.1vw, 28px)/1.25 var(--font); letter-spacing: -.01em; max-width: 26ch; }
  .hero .lede { max-width: 38em; margin-top: 16px; color: var(--muted); font-size: clamp(16px, 1.3vw, 18.5px); }
  .ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .toast { margin-top: 14px; min-height: 1.5em; font: 500 14px/1.5 var(--font); color: var(--accent); }
  .hero-strip { position: relative; z-index: 2; margin-top: auto; margin-bottom: clamp(18px, 3vh, 32px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0; overflow: hidden; border-radius: 18px; }
  .hero-strip > div { padding: 16px 20px 18px; border-right: 1px solid var(--line); }
  .hero-strip > div:last-child { border-right: 0; }
  .hero-strip .k { display: block; font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
  .hero-strip .v { font: 600 15px/1.25 var(--font); }
  .hero-strip .v.hot { color: var(--accent); }

  /* app window: a Mac window in glass, shared by the demo player and the tour */
  .win { position: relative; border-radius: 16px; overflow: hidden; background: var(--bg-2); border: 1px solid var(--line-2); box-shadow: 0 60px 120px -50px rgba(0,0,0,.7), inset 0 1px 0 var(--edge); }
  [data-theme='light'] .win { background: rgba(252, 251, 255, .92); box-shadow: 0 60px 120px -50px rgba(76, 52, 150, .45), inset 0 1px 0 #fff; }
  .win-bar { display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-bottom: 1px solid var(--line); }
  .win-bar i { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .win-bar i:nth-child(1) { background: #ff5f57; } .win-bar i:nth-child(2) { background: #febc2e; } .win-bar i:nth-child(3) { background: #28c840; }
  .win-bar span { flex: 1; margin-right: 40px; text-align: center; font: 500 12px/1 var(--sys); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win-view { position: relative; aspect-ratio: var(--shot-ratio, 16 / 10); background: #0d0c16; }
  .win-view video, .win-view img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .win-glow { position: relative; }
  .win-glow::before { content: ''; position: absolute; inset: 8% 6% -4%; background: conic-gradient(from 90deg, var(--cyan), var(--violet), var(--rose), var(--accent), var(--cyan)); filter: blur(70px); opacity: .22; border-radius: 40px; z-index: -1; }
  /* one image per theme; the other one stays display:none, so a lazy image is never fetched */
  [data-theme='dark'] .th-light, [data-theme='light'] .th-dark { display: none !important; }

  /* demo: real screen recordings */
  .demo-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: stretch; }
  .clips { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
  .clips-head { display: flex; justify-content: space-between; padding: 4px 4px 10px; border-bottom: 1px solid var(--line); font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .clip { position: relative; display: block; width: 100%; text-align: left; padding: 14px 14px 16px; border-radius: 14px; border: 1px solid transparent; background: transparent; color: var(--text); font: inherit; cursor: pointer; overflow: hidden; transition: background-color .3s, border-color .3s; }
  .clip:hover { background: var(--glass); }
  .clip[aria-pressed='true'] { background: var(--glass-2); border-color: var(--line-2); }
  .clip .k { display: block; font: 500 10px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .clip[aria-pressed='true'] .k { color: var(--accent); }
  .clip b { display: block; margin-top: 8px; font: 600 15px/1.3 var(--font); }
  .clip small { display: block; margin-top: 4px; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
  .clip .bar { position: absolute; left: 14px; right: 14px; bottom: 7px; height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; opacity: 0; transition: opacity .3s; }
  .clip[aria-pressed='true'] .bar { opacity: 1; }
  .clip .bar i { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(var(--p, 0)); background: var(--holo); background-size: 300% 100%; }
  .clips-foot { margin-top: auto; padding: 10px 4px 2px; font-size: 12.5px; color: var(--faint); }

  /* tour: a sticky window whose screen follows the step you are reading */
  .tour { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: clamp(28px, 4vw, 64px); }
  .tour-stage { position: sticky; top: max(84px, calc(50vh - 250px)); align-self: start; }
  .tour-stage .win-view img { opacity: 0; transform: scale(1.015); transition: opacity .55s var(--ease), transform .8s var(--ease); cursor: zoom-in; }
  .tour-stage .win-view img.on { opacity: 1; transform: none; }
  .tour-cap { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; font: 500 10.5px/1.5 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .tour-cap b { color: var(--accent); font-weight: 500; }
  .tour-steps { list-style: none; margin: 0; padding: 12vh 0 18vh; counter-reset: step; }
  .tour-step { min-height: 62vh; display: flex; flex-direction: column; justify-content: center; padding: 0 0 0 26px; border-left: 1px solid var(--line); opacity: .38; transition: opacity .5s var(--ease), border-color .5s; scroll-margin-top: 20vh; }
  .tour-step.on { opacity: 1; border-left-color: var(--accent); }
  .tour-step .k { font: 500 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .tour-step h3 { margin: 14px 0 10px; font: 600 clamp(22px, 2.2vw, 30px)/1.12 var(--display); letter-spacing: -.02em; }
  .tour-step p { color: var(--muted); font-size: 16.5px; max-width: 30em; }
  .tour-step figure { display: none; margin: 18px 0 0; }
  .tour-step figure img { width: 100%; height: auto; border-radius: 12px; border: 1px solid var(--line-2); box-shadow: 0 30px 60px -30px rgba(0,0,0,.6); }
  .phones { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: clamp(28px, 5vw, 80px); align-items: center; margin-top: clamp(40px, 6vw, 90px); scroll-margin-top: 90px; }

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {

})();

/* ─── Project page behaviour (template) ─── */
(function () {
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hasGsap = !!(window.gsap && window.ScrollTrigger);
  if (hasGsap) { gsap.registerPlugin(ScrollTrigger); gsap.ticker.lagSmoothing(0); }
  function $(id) { return document.getElementById(id); }

  document.querySelectorAll('[data-early]').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.parentElement.parentElement.querySelector('.toast');
      var P = JSON.parse($('project-data').textContent);
      if (t) t.textContent = P.primaryCta.toast;
      b.querySelector('span').textContent = P.status;
    });
  });

  // scramble labels (text is already in place; this only shuffles it briefly)
  var GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/·';
  function scramble(el) {
    var final = el.textContent, n = 0, total = 16;
    var iv = setInterval(function () {
      n++;
      el.textContent = final.split('').map(function (c, i) { return (c === ' ' || i < (n / total) * final.length) ? c : GLYPHS[(Math.random() * GLYPHS.length) | 0]; }).join('');
      if (n >= total) { clearInterval(iv); el.textContent = final; }
    }, 40);
  }
  if (!RM && 'IntersectionObserver' in window) {
    var so = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { scramble(e.target); so.unobserve(e.target); } }); }, { threshold: .6 });
    document.querySelectorAll('[data-scramble]').forEach(function (el) { so.observe(el); });
  }

  // architecture wires + packets
  var arch = $('arch'), wires = $('wires'), core = $('core-node');
  var NS = 'http://www.w3.org/2000/svg', packets = [];
  var COLORS = ['var(--cyan)', 'var(--violet)', 'var(--rose)', 'var(--accent)', 'var(--gold)', 'var(--cyan)'];
  function buildWires() {
    wires.innerHTML = ''; packets = [];
    var a = arch.getBoundingClientRect(), c = core.getBoundingClientRect();
    var vertical = getComputedStyle(arch).gridTemplateColumns.split(' ').length < 3;
    function rel(r) { return { l: r.left - a.left, r: r.right - a.left, t: r.top - a.top, b: r.bottom - a.top, cx: r.left - a.left + r.width / 2, cy: r.top - a.top + r.height / 2 }; }
    var C = rel(c);
    arch.querySelectorAll('[data-node]').forEach(function (n, i) {
      var R = rel(n.getBoundingClientRect()), d, isClient = n.dataset.node === 'c';
      if (!vertical) {
        d = isClient ? 'M' + R.r + ' ' + R.cy + ' C ' + (R.r + 60) + ' ' + R.cy + ', ' + (C.l - 60) + ' ' + C.cy + ', ' + C.l + ' ' + C.cy
                     : 'M' + C.r + ' ' + C.cy + ' C ' + (C.r + 60) + ' ' + C.cy + ', ' + (R.l - 60) + ' ' + R.cy + ', ' + R.l + ' ' + R.cy;
      } else {
        d = isClient ? 'M' + R.cx + ' ' + R.b + ' C ' + R.cx + ' ' + (R.b + 30) + ', ' + C.cx + ' ' + (C.t - 30) + ', ' + C.cx + ' ' + C.t
                     : 'M' + C.cx + ' ' + C.b + ' C ' + C.cx + ' ' + (C.b + 30) + ', ' + R.cx + ' ' + (R.t - 30) + ', ' + R.cx + ' ' + R.t;
      }
      var p = document.createElementNS(NS, 'path'); p.setAttribute('d', d); wires.appendChild(p);
      if (RM) return;
      var len = p.getTotalLength();
      for (var k = 0; k < 2; k++) {
        var dot = document.createElementNS(NS, 'circle'); dot.setAttribute('r', k ? 2.5 : 3.5);
        dot.style.fill = COLORS[i % COLORS.length]; dot.style.color = COLORS[i % COLORS.length]; wires.appendChild(dot);
        packets.push({ dot: dot, path: p, len: len, off: Math.random(), speed: .18 + Math.random() * .12, back: !!k });
      }
    });
  }
  var archVisible = false;
  function animPackets(now) {
    if (archVisible) packets.forEach(function (k) {
      var u = (k.off + now / 1000 * k.speed) % 1; if (k.back) u = 1 - u;
      var pt = k.path.getPointAtLength(u * k.len);
      k.dot.setAttribute('cx', pt.x.toFixed(1)); k.dot.setAttribute('cy', pt.y.toFixed(1));
      k.dot.setAttribute('opacity', Math.sin(u * Math.PI).toFixed(2));
    });
    requestAnimationFrame(animPackets);
  }
  buildWires();
  new ResizeObserver(buildWires).observe(arch);
  if (document.fonts) document.fonts.ready.then(buildWires);
  new IntersectionObserver(function (es) { archVisible = es[0].isIntersecting; }).observe(arch);
  if (!RM) requestAnimationFrame(animPackets);

  // scroll motion: transforms only, content is never hidden
  if (hasGsap && !RM) {
    ScrollTrigger.batch('[data-reveal]', {
      start: 'top 92%', once: true,
      onEnter: function (els) { gsap.from(els, { y: 34, rotateX: 8, transformPerspective: 900, duration: .9, ease: 'expo.out', stagger: .06 }); }
    });
    gsap.from('.arch .node', { y: 26, duration: .9, stagger: .07, ease: 'expo.out', scrollTrigger: { trigger: '#arch', start: 'top 85%', once: true } });
    gsap.to('.cta .rings', { rotate: 40, ease: 'none', scrollTrigger: { trigger: '.cta', start: 'top bottom', end: 'bottom top', scrub: true } });
    gsap.to('.hero-icon', { y: -60, ease: 'none', scrollTrigger: { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: true } });
  }
})();

/* ─── Project module: recordings player (demo) ─── */
(function () {
  var v = document.getElementById('demo-video');
  if (!v) return;
  var P = JSON.parse(document.getElementById('project-data').textContent);
  var clips = P.demo.clips, path = P.media.path + (P.media.prefix || 'nt-'), formats = P.media.clipFormats || ['webm', 'mp4'];
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var btns = [].slice.call(document.querySelectorAll('[data-clip]'));
  var time = document.getElementById('clip-time'), cap = document.getElementById('demo-caption');
  var cur = 0, inView = false, lastT = 0;
  // Reduced motion: poster only, the visitor can start a clip with the controls.
  if (RM) v.controls = true;
  function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }
  function play() { if (!RM && inView && !document.hidden) { var p = v.play(); if (p && p.catch) p.catch(function () {}); } }
  function load(i, auto) {
    cur = i; lastT = 0;
    var c = clips[i];
    btns.forEach(function (b, k) { b.setAttribute('aria-pressed', k === i ? 'true' : 'false'); b.style.setProperty('--p', 0); });
    v.poster = path + 'clip-' + c.id + '-poster.webp';
    v.innerHTML = formats.map(function (f) { return '<source src="' + path + 'clip-' + c.id + '.' + f + '" type="video/' + f + '">'; }).join('');
    v.setAttribute('aria-label', c.label); cap.textContent = c.label;
    v.preload = RM ? 'none' : 'auto';
    v.load();
    if (auto) play();
  }
  btns.forEach(function (b, i) { b.addEventListener('click', function () { load(i, true); }); });
  // The clips loop; when one wraps around, move on to the next recording.
  v.addEventListener('timeupdate', function () {
    var d = v.duration || 1;
    if (btns[cur]) btns[cur].style.setProperty('--p', (v.currentTime / d).toFixed(3));
    time.textContent = pad(v.currentTime / 60) + ':' + pad(v.currentTime % 60);
    if (!RM && v.currentTime + .5 < lastT) { lastT = 0; load((cur + 1) % clips.length, true); return; }
    lastT = v.currentTime;
  });
  new IntersectionObserver(function (es) {
    inView = es[0].isIntersecting;
    if (inView) { if (!RM) v.preload = 'auto'; play(); } else v.pause();
  }, { threshold: .35 }).observe(v);
  document.addEventListener('visibilitychange', function () { if (document.hidden) v.pause(); else play(); });
})();

/* ─── Project module: screenshot tour ─── */
(function () {
  var view = document.getElementById('tour-view');
  if (!view) return;
  var steps = [].slice.call(document.querySelectorAll('.tour-step'));
  var imgs = [].slice.call(view.querySelectorAll('img'));
  var num = document.getElementById('tour-num'), capEl = document.getElementById('tour-cap');
  var cur = -1;
  function show(i) {
    if (i === cur) return;
    cur = i;
    steps.forEach(function (s, k) { s.classList.toggle('on', k === i); });
    imgs.forEach(function (im) { im.classList.toggle('on', +im.dataset.i === i); });
    num.textContent = String(i + 1).padStart(2, '0');
    capEl.textContent = steps[i].querySelector('.k').textContent.replace(/^\d+ · /, '');
  }
  // The step whose middle is closest to the middle of the viewport wins.
  var io = new IntersectionObserver(function () {
    var mid = innerHeight / 2, best = 0, bestD = Infinity;
    steps.forEach(function (s, k) { var r = s.getBoundingClientRect(), d = Math.abs(r.top + r.height / 2 - mid); if (d < bestD) { bestD = d; best = k; } });
    show(best);
  }, { rootMargin: '-35% 0px -35% 0px', threshold: [0, .5, 1] });
  steps.forEach(function (s) { io.observe(s); });
  show(0);
  // Lightbox: the full 2x screenshot in the current theme.
  var box = document.getElementById('lightbox'), boxImg = document.getElementById('lightbox-img'), boxCap = document.getElementById('lightbox-cap');
  function open(img) {
    if (!box.showModal) return;
    boxImg.src = img.currentSrc.replace(/-1440\.webp$/, '.webp') || img.src;
    boxImg.alt = img.alt; boxCap.textContent = img.alt;
    box.showModal();
  }
  document.querySelectorAll('#tour-view img, .tour-step figure img, .gal img').forEach(function (img) {
    img.addEventListener('click', function () { open(img); });
  });
  box.addEventListener('click', function (e) { if (e.target === box || e.target === boxImg) box.close(); });
  // Feature links jump to a step; make sure its screen is shown right away.
  addEventListener('hashchange', function () {
    var el = document.getElementById(location.hash.slice(1));
    if (el && el.classList.contains('tour-step')) show(+el.dataset.i);
  });
})();
</script>

<script type="module">
// Hero: a holographic wireframe landscape with a planet rising over the horizon.
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hero = document.querySelector('.hero');
const canvas = document.getElementById('terrain');

function init() {
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); } catch (e) { return; }
  // Software WebGL (SwiftShader, llvmpipe) would starve the page: draw one still frame there.
  const gl = renderer.getContext();
  let software = false;
  try { const ext = gl.getExtension('WEBGL_debug_renderer_info'); software = /swiftshader|llvmpipe|softpipe|software|basic render/i.test(String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER))); } catch (e) {}
  const still = RM || software;
  renderer.setPixelRatio(software ? .6 : Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, 1, .1, 300);
  const css = (n) => new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue(n).trim());
  const isDark = () => document.documentElement.dataset.theme === 'dark';

  const U = { uTime: { value: 0 }, uFill: { value: new THREE.Color() }, uHigh: { value: new THREE.Color() }, uFillA: { value: 1 }, uLineA: { value: 1 }, uDark: { value: 1 }, uFar: { value: 90 } };
  const NOISE = `
    vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;} vec2 mod289(vec2 x){return x-floor(x*(1./289.))*289.;}
    vec3 permute(vec3 x){return mod289(((x*34.)+1.)*x);}
    float snoise(vec2 v){const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);
      vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx); vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);
      vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=mod289(i);
      vec3 p=permute(permute(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));
      vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.); m=m*m; m=m*m;
      vec3 x=2.*fract(p*C.www)-1.; vec3 h=abs(x)-.5; vec3 ox=floor(x+.5); vec3 a0=x-ox;
      m*=1.79284291400159-.85373472095314*(a0*a0+h*h);
      vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw; return 130.*dot(m,g);}
    float terrain(vec2 p){ float n = snoise(p*.045)*1.0 + snoise(p*.11)*.35 + snoise(p*.25)*.1;
      return (n*2.6 + 1.2) * smoothstep(1.5, 12., abs(p.x)); }`;
  const SPEC = `vec3 spec(float x, float dark){ vec3 c = .5+.5*cos(6.28318*(x+vec3(0.,.33,.67))); return mix(mix(c, vec3(.3,.22,.6), .45), c, dark); }`;

  const geo = new THREE.PlaneGeometry(160, 120, 200, 150);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.ShaderMaterial({
    uniforms: U, transparent: true, extensions: { derivatives: true },
    vertexShader: NOISE + `
      uniform float uTime; varying vec2 vW; varying float vD; varying float vH; varying float vX;
      void main(){ vec3 p = position; vec2 w = vec2(p.x, p.z - uTime * 2.2);
        float h = terrain(w); p.y += h; vW = w; vH = h; vX = p.x;
        vec4 mv = modelViewMatrix * vec4(p, 1.); vD = -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: SPEC + `
      uniform vec3 uFill; uniform vec3 uHigh; uniform float uFillA; uniform float uFar; uniform float uLineA; uniform float uDark; uniform float uTime;
      varying vec2 vW; varying float vD; varying float vH; varying float vX;
      void main(){ vec2 g = abs(fract(vW / 2.) - .5) / fwidth(vW / 2.); float l = 1. - min(min(g.x, g.y), 1.);
        float fade = 1. - smoothstep(uFar * .35, uFar, vD);
        vec3 lc = spec(vD * .012 + vX * .006 + uTime * .03, uDark);
        lc = mix(lc, uHigh, smoothstep(2.2, 4.4, vH));
        vec3 col = mix(uFill, lc, l * uLineA);
        gl_FragColor = vec4(col, max(uFillA, l * uLineA) * fade); }`,
  });
  scene.add(new THREE.Mesh(geo, mat));

  // Rising planet: an iridescent wireframe sphere
  const planet = new THREE.Group();
  const RAD = 16;
  const lineMat = new THREE.ShaderMaterial({
    uniforms: U, transparent: true,
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
    fragmentShader: SPEC + `uniform float uTime; uniform float uDark; uniform vec3 uHigh; varying vec3 vP;
      void main(){ vec3 c = spec(dot(normalize(vP), normalize(vec3(.4,.8,.3))) * .8 + uTime * .05, uDark);
        gl_FragColor = vec4(c, mix(.55, .8, uDark)); }`,
  });
  const eqMat = new THREE.LineBasicMaterial({ transparent: true });
  const fillMat = new THREE.MeshBasicMaterial({ transparent: true });
  planet.add(new THREE.Mesh(new THREE.SphereGeometry(RAD * .995, 48, 32), fillMat));
  for (let lat = -75; lat <= 75; lat += 15) {
    const r = RAD * Math.cos(lat * Math.PI / 180), y = RAD * Math.sin(lat * Math.PI / 180);
    const pts = Array.from({ length: 97 }, (_, i) => new THREE.Vector3(Math.cos(i / 96 * Math.PI * 2) * r, y, Math.sin(i / 96 * Math.PI * 2) * r));
    planet.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lat === 0 ? eqMat : lineMat));
  }
  for (let lon = 0; lon < 180; lon += 15) {
    const pts = Array.from({ length: 97 }, (_, i) => { const a = i / 96 * Math.PI * 2; return new THREE.Vector3(Math.cos(a) * RAD, Math.sin(a) * RAD, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), lon * Math.PI / 180); });
    planet.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
  }
  // a thin ring, echoing the orb on the homepage
  const ringPts = Array.from({ length: 161 }, (_, i) => { const a = i / 160 * Math.PI * 2; return new THREE.Vector3(Math.cos(a) * RAD * 1.6, 0, Math.sin(a) * RAD * 1.6); });
  const ring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(ringPts), lineMat);
  ring.rotation.x = .25; planet.add(ring);
  planet.rotation.z = .41;
  planet.position.set(55, 4, -95);
  scene.add(planet);

  const sN = 700, sp = new Float32Array(sN * 3);
  for (let i = 0; i < sN; i++) sp.set([(Math.random() - .5) * 400, 8 + Math.random() * 120, -120 - Math.random() * 60], i * 3);
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  const sMat = new THREE.PointsMaterial({ size: 1.5, sizeAttenuation: false, transparent: true, depthWrite: false });
  scene.add(new THREE.Points(sg, sMat));

  function applyTheme() {
    const dark = isDark();
    U.uDark.value = dark ? 1 : 0;
    U.uFill.value.copy(css('--bg'));
    U.uHigh.value.copy(css('--accent'));
    U.uFillA.value = dark ? .92 : .9;
    U.uLineA.value = dark ? .8 : .6;
    eqMat.color.copy(css('--accent')); eqMat.opacity = 1;
    fillMat.color.copy(css('--bg')); fillMat.opacity = 1;
    sMat.color.copy(dark ? new THREE.Color('#dcd6ff') : css('--violet')); sMat.opacity = dark ? .75 : .25;
    if (still) render(6);
  }
  let W = 1, H = 1;
  function resize() {
    W = canvas.clientWidth; H = canvas.clientHeight;
    renderer.setSize(W, H, false); camera.aspect = W / H;
    camera.fov = W < 700 ? 70 : 55;
    planet.position.x = W < 700 ? 14 : 55;
    camera.updateProjectionMatrix();
    if (still) render(6);
  }
  const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
  addEventListener('pointermove', (e) => { mouse.tx = e.clientX / innerWidth - .5; mouse.ty = e.clientY / innerHeight - .5; }, { passive: true });
  function render(t) {
    U.uTime.value = t;
    mouse.x += (mouse.tx - mouse.x) * .04; mouse.y += (mouse.ty - mouse.y) * .04;
    const s = Math.min(1, scrollY / Math.max(1, H));
    camera.position.set(mouse.x * 3, 5.2 + mouse.y * -1.2 + s * 3, 20);
    camera.lookAt(mouse.x * 2, 7.5 - s * 2, -40);
    camera.rotation.z += Math.sin(t * .3) * .008;
    planet.rotation.y = t * .05;
    planet.position.y = 8 + Math.min(1, t / 8) * 6 + s * 6;
    renderer.render(scene, camera);
  }
  new ResizeObserver(resize).observe(hero);
  resize(); applyTheme();
  addEventListener('themechange', applyTheme);
  if (still) return;
  let visible = true, raf = 0;
  const clock = new THREE.Clock();
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible && !raf) loop(); }).observe(hero);
  function loop() {
    if (!visible || document.hidden) { raf = 0; return; }
    render(clock.getElapsedTime());
    raf = requestAnimationFrame(loop);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && visible && !raf) loop(); });
  loop();
}
init();
</script>
</body>
</html>

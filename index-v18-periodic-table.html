<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nerdy.nl — The Periodic Table of Me</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.88em' font-size='85'%3E⚗%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;
  --alkali:#e85d5d;--transition:#e8a63c;--metal:#4fb0c6;--metalloid:#8c5bc1;
  --gas:#5bd47c;--halogen:#e868b0;--noble:#c9cfd8;
  --display:'Space Grotesk',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--fg);font-family:var(--display);min-height:100vh;padding:2rem 1.5rem;
  background-image:
    radial-gradient(circle at 20% 10%,rgba(232,166,60,.08),transparent 40%),
    radial-gradient(circle at 80% 80%,rgba(79,176,198,.08),transparent 40%)}
.wrap{max-width:1240px;margin:0 auto}

.hdr{border-bottom:1px solid var(--line);padding-bottom:1.2rem;margin-bottom:1.8rem;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1rem}
.hdr__left h1{font-size:clamp(1.8rem,3.5vw,2.6rem);font-weight:700;letter-spacing:-.02em;line-height:1}
.hdr__left h1 em{font-style:normal;color:var(--transition)}
.hdr__left p{font-family:var(--mono);font-size:.75rem;color:var(--dim);margin-top:.5rem;letter-spacing:.04em}
.hdr__right{font-family:var(--mono);font-size:.7rem;text-align:right;color:var(--dim);letter-spacing:.05em}
.hdr__right strong{color:var(--fg);display:block}

.legend{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1.5rem;font-family:var(--mono);font-size:.7rem}
.legend__item{display:flex;align-items:center;gap:.4rem;padding:.35rem .65rem;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
.legend__item i{width:10px;height:10px;border-radius:2px;display:inline-block}

.table{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin-bottom:1.5rem}
.el{aspect-ratio:1;border:1px solid var(--line);border-radius:4px;padding:.45rem;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;overflow:hidden;
  background:var(--panel);transition:transform .15s,border-color .15s}
.el:hover{transform:translateY(-2px);border-color:var(--fg)}
.el__num{font-family:var(--mono);font-size:.55rem;color:var(--dim);line-height:1}
.el__sym{font-family:var(--display);font-weight:700;font-size:clamp(.9rem,2vw,1.5rem);line-height:1;text-align:center;margin:auto 0}
.el__name{font-family:var(--mono);font-size:.55rem;text-align:center;color:var(--fg);line-height:1.1;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.el__mass{font-family:var(--mono);font-size:.5rem;color:var(--dim);text-align:center;line-height:1;margin-top:.15rem}
.el.projects{background:linear-gradient(145deg,rgba(232,93,93,.18),rgba(232,93,93,.05));border-color:rgba(232,93,93,.4)}
.el.projects .el__sym{color:var(--alkali)}
.el.transition{background:linear-gradient(145deg,rgba(232,166,60,.18),rgba(232,166,60,.05));border-color:rgba(232,166,60,.4)}
.el.transition .el__sym{color:var(--transition)}
.el.metal{background:linear-gradient(145deg,rgba(79,176,198,.18),rgba(79,176,198,.05));border-color:rgba(79,176,198,.4)}
.el.metal .el__sym{color:var(--metal)}
.el.metalloid{background:linear-gradient(145deg,rgba(140,91,193,.18),rgba(140,91,193,.05));border-color:rgba(140,91,193,.4)}
.el.metalloid .el__sym{color:var(--metalloid)}
.el.gas{background:linear-gradient(145deg,rgba(91,212,124,.18),rgba(91,212,124,.05));border-color:rgba(91,212,124,.4)}
.el.gas .el__sym{color:var(--gas)}
.el.halogen{background:linear-gradient(145deg,rgba(232,104,176,.18),rgba(232,104,176,.05));border-color:rgba(232,104,176,.4)}
.el.halogen .el__sym{color:var(--halogen)}
.el.noble{background:linear-gradient(145deg,rgba(201,207,216,.18),rgba(201,207,216,.05));border-color:rgba(201,207,216,.4)}
.el.noble .el__sym{color:var(--noble)}
.el.empty{background:transparent;border:1px dashed rgba(139,148,158,.15);cursor:default;pointer-events:none}
.el.empty:hover{transform:none}

.legend__item.projects i{background:var(--alkali)}
.legend__item.transition i{background:var(--transition)}
.legend__item.metal i{background:var(--metal)}
.legend__item.metalloid i{background:var(--metalloid)}
.legend__item.gas i{background:var(--gas)}
.legend__item.halogen i{background:var(--halogen)}
.legend__item.noble i{background:var(--noble)}

.detail{min-height:150px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:1.4rem 1.6rem;
  display:grid;grid-template-columns:140px 1fr;gap:1.4rem;align-items:start}
.detail__card{border:1px solid var(--line);border-radius:4px;padding:.8rem;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1;text-align:center;
  background:linear-gradient(145deg,rgba(255,255,255,.03),transparent)}
.detail__card .el__sym{font-size:2.4rem;margin:.4rem 0}
.detail__card .el__num{text-align:left}
.detail__card .el__mass{text-align:right}
.detail__card .el__name{font-size:.65rem}
.detail__body h2{font-family:var(--display);font-weight:500;font-size:1.5rem;letter-spacing:-.01em;margin-bottom:.3rem}
.detail__body .props{font-family:var(--mono);font-size:.7rem;color:var(--dim);margin-bottom:.9rem;letter-spacing:.03em}
.detail__body p{font-size:.95rem;line-height:1.6;color:#c2ccd4}
.detail__hint{font-family:var(--mono);font-size:.72rem;color:var(--dim);font-style:italic;margin-top:.8rem}

.foot{margin-top:2rem;padding-top:1.2rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem;font-family:var(--mono);font-size:.68rem;color:var(--dim);letter-spacing:.04em}
.foot a{color:var(--fg);text-decoration:none;border-bottom:1px dotted var(--dim)}

@media(max-width:780px){
  .table{grid-template-columns:repeat(6,1fr)}
  .detail{grid-template-columns:1fr}
  .detail__card{max-width:140px}
}
@media(max-width:480px){
  body{padding:1rem .7rem}
  .table{grid-template-columns:repeat(4,1fr);gap:4px}
  .el__name{font-size:.48rem}
  .el__mass{display:none}
}
</style>
</head>
<body>
<div class="wrap">

<header class="hdr">
  <div class="hdr__left">
    <h1>The <em>Periodic</em> Table of Me</h1>
    <p>// elements that make up one developer, one dad, one drummer</p>
  </div>
  <div class="hdr__right">
    <strong>nerdy.nl</strong>
    <span>classification · 2026</span>
    <span id="atomicDate"></span>
  </div>
</header>

<div class="legend">
  <span class="legend__item projects"><i></i>Projects</span>
  <span class="legend__item transition"><i></i>Infra</span>
  <span class="legend__item metal"><i></i>Tooling</span>
  <span class="legend__item metalloid"><i></i>Music</span>
  <span class="legend__item gas"><i></i>Workshop</span>
  <span class="legend__item halogen"><i></i>Family</span>
  <span class="legend__item noble"><i></i>Philosophy</span>
</div>

<div class="table" id="table"></div>

<section class="detail" id="detail"></section>

<footer class="foot">
  <span>&copy; nerdy.nl · assembled atom by atom</span>
  <span>Putting the Y in Nerdy</span>
  <a href="https://github.com/enipo">github.com/enipo</a>
</footer>

</div>

<script>
const ELEMENTS=[
  {n:1,sym:'Nt',name:'Nerdium',mass:'360.24',cat:'projects',title:'Nerdy Terminal',props:'Group: CLI · State: solid · Shell: zsh',body:'A keyboard-first terminal manager for macOS. Multiple sessions, instant switching, no mouse required. Reacts violently to pointer events.'},
  {n:2,sym:'K8',name:'Kubium',mass:'1.28k',cat:'transition',title:'Kubernetes Clusters',props:'Group: infra · State: clustered · Replicas: way too many',body:'A self-hosted control plane. Five clusters, one household, zero regret. When questioned, it stares into the distance and whispers "GitOps."'},
  {n:3,sym:'Mc',name:'Mercurium',mass:'β',cat:'transition',title:'MCP Gateway',props:'Group: integration · Bonds: Slack, Jira, DB, Grafana, Tailscale',body:'A bridge element that binds LLMs to everything else. Highly reactive — forms stable compounds with almost any API.'},
  {n:4,sym:'Tb',name:'Tibidium',mass:'0.1',cat:'projects',title:'TBD',props:'Group: productivity · Bells: 0 · Whistles: 0',body:'A personal productivity app. Captures, projects, tasks. Stripped of every gimmick until only the essential verbs remained.'},
  {n:5,sym:'Px',name:'Pixelium',mass:'16px',cat:'projects',title:'Pixel Tanks',props:'Group: multiplayer · Res: intentionally low',body:'Top-down tank combat. Built for the joy of destroying friends in low resolution. Friendships strained, ego enlarged.'},
  {n:6,sym:'Ha',name:'Habitium',mass:'YAML',cat:'transition',title:'Home Assistant',props:'Group: domotica · Protocol: Zigbee · WAF: ≤ 1',body:'A smart home held together by YAML and stubbornness. Produces automations nobody asked for. Only stable when the lights obey.'},
  {n:7,sym:'Yl',name:'Yamlium',mass:'2sp',cat:'metal',title:'YAML, endless',props:'Group: config · Indent: strictly 2 · Errors: silent',body:'The universal solvent of infra. Dissolves Helm charts, Ansible playbooks and weekends in equal measure.'},
  {n:8,sym:'Zg',name:'Zignium',mass:'2.4',cat:'metalloid',title:'Zigbee',props:'Group: mesh · Range: optimistic',body:'A radio protocol of small devices and big claims. Works, until someone microwaves popcorn.'},
  {n:9,sym:'Tl',name:'Tailium',mass:'100.64',cat:'metal',title:'Tailscale',props:'Group: networking · Mode: magic',body:'A mesh VPN that makes every device feel local. Quietly the glue under half of the homelab.'},
  {n:10,sym:'Dr',name:'Drumium',mass:'4/4',cat:'metalloid',title:'Drums — Mazu',props:'Group: rhythm · Style: instrumental stoner',body:'Heavy, slow, loud. Drummer in Mazu — the kind of band where nobody asks what the lyrics are about.'},
  {n:11,sym:'Gu',name:'Guitarium',mass:'E♭',cat:'metalloid',title:'Guitar',props:'Group: strings · Skill: low · Persistence: high',body:'Played badly but enthusiastically. Known to produce noise complaints and modest personal joy.'},
  {n:12,sym:'Ws',name:'Sawdustium',mass:'80',cat:'gas',title:'Workshop',props:'Group: woodworking · Location: basement',body:'A small shop, mostly sawdust and ambition. Every new tool justified as an investment in a future, cleaner version of this room.'},
  {n:13,sym:'Ch',name:'Chiselium',mass:'12',cat:'gas',title:'Hand tools',props:'Group: manual · Sharp: occasionally',body:'A growing collection of chisels, planes and saws. Each one slightly too nice for the job at hand.'},
  {n:14,sym:'Da',name:'Dadium',mass:'×3',cat:'halogen',title:'Dad × 3',props:'Group: family · WAF use case: smart lights only',body:'Three kids. They are not impressed by Kubernetes. They are mildly impressed by the hallway lights turning on by themselves.'},
  {n:15,sym:'Wf',name:'Wafium',mass:'~0',cat:'halogen',title:'WAF',props:'Group: family · Trend: downwards',body:'Wife Acceptance Factor of a self-hosted smart home. Historically low. Considered stable at current levels.'},
  {n:16,sym:'No',name:'Nothingium',mass:'—',cat:'noble',title:'No blog, no strategy',props:'Group: noble · Reactivity: none',body:'No blog. No thought leadership. No content strategy. Everything worth saying has been generated by an LLM already. This is just a workbench.'},
  {n:17,sym:'Wy',name:'Whyium',mass:'?',cat:'noble',title:'Putting the Y in Nerdy',props:'Group: noble · Half-life: indefinite',body:'A stable, inert element of pure curiosity. Asks "why" repeatedly and refuses to accept the first answer.'}
];
const LAYOUT=[
  [1,null,null,null,null,null,null,null,17],
  [4,5,null,null,null,null,null,6,16],
  [2,3,null,null,null,null,7,8,9],
  [10,11,null,null,null,12,13,14,15]
];

const table=document.getElementById('table');
const detail=document.getElementById('detail');
const byId={};ELEMENTS.forEach(e=>byId[e.n]=e);

function makeEl(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!=null)x.textContent=text;return x}

function buildTile(e){
  const box=makeEl('div','el '+e.cat);
  box.appendChild(makeEl('div','el__num',String(e.n).padStart(2,'0')));
  box.appendChild(makeEl('div','el__sym',e.sym));
  box.appendChild(makeEl('div','el__name',e.name));
  box.appendChild(makeEl('div','el__mass',e.mass));
  return box;
}

LAYOUT.forEach(row=>row.forEach(n=>{
  if(n===null){table.appendChild(makeEl('div','el empty'));return}
  const e=byId[n];
  const t=buildTile(e);
  t.addEventListener('click',()=>show(n));
  t.addEventListener('mouseenter',()=>show(n));
  table.appendChild(t);
}));

function show(n){
  const e=byId[n];
  while(detail.firstChild)detail.removeChild(detail.firstChild);
  const card=buildTile(e);card.classList.add('detail__card');card.style.cursor='default';
  const body=makeEl('div','detail__body');
  body.appendChild(makeEl('h2',null,e.title));
  body.appendChild(makeEl('div','props',e.props));
  body.appendChild(makeEl('p',null,e.body));
  body.appendChild(makeEl('p','detail__hint','// hover or tap another element to examine.'));
  detail.appendChild(card);detail.appendChild(body);
}
show(1);
document.getElementById('atomicDate').textContent='rev. '+new Date().toISOString().slice(0,10);
</script>
</body>
</html>

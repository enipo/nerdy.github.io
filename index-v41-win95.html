<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gray:#c0c0c0;
  --gray-d:#808080;
  --gray-l:#dfdfdf;
  --black:#000;
  --blue:#000080;
  --teal:#008080;
  --hi:#0a246a;
  --face:#c0c0c0;
}
html,body{
  background:var(--teal);
  font-family:'Tahoma','MS Sans Serif','Lucida Sans Unicode',sans-serif;
  font-size:11px;
  color:#000;
  min-height:100vh;
  overflow:hidden;
  height:100vh;
}
.desktop{position:absolute;inset:0 0 30px 0;overflow:hidden}
.dico{position:absolute;width:74px;display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center;color:#fff;text-shadow:1px 1px 0 #000}
.dico .img{width:32px;height:32px;margin-bottom:4px;display:flex;align-items:center;justify-content:center}
.dico .img svg{width:32px;height:32px}
.dico .lbl{font-size:11px;padding:1px 3px;line-height:1.2;border:1px dotted transparent}
.dico:hover .lbl,.dico.sel .lbl{background:var(--hi);border:1px dotted #fff}
.taskbar{position:fixed;bottom:0;left:0;right:0;height:30px;background:var(--gray);border-top:1px solid #fff;box-shadow:inset 0 1px 0 #fff;display:flex;align-items:center;padding:2px;gap:4px;z-index:1000}
.start-btn{display:flex;align-items:center;gap:4px;background:var(--gray);border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset 1px 1px 0 #dfdfdf,inset -1px -1px 0 #808080;padding:2px 6px 2px 4px;font-weight:700;cursor:pointer;font-size:11px;height:24px}
.start-btn:active,.start-btn.open{border-color:#000 #fff #fff #000;box-shadow:inset -1px -1px 0 #dfdfdf,inset 1px 1px 0 #808080}
.start-btn .logo{width:16px;height:16px}
.task-items{display:flex;gap:3px;flex:1;margin-left:4px;overflow:hidden}
.task-item{background:var(--gray);border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset 1px 1px 0 #dfdfdf,inset -1px -1px 0 #808080;padding:2px 6px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;height:24px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-item.active{border-color:#000 #fff #fff #000;box-shadow:inset -1px -1px 0 #dfdfdf,inset 1px 1px 0 #808080;background:repeating-linear-gradient(45deg,#bdbdbd 0 2px,#cdcdcd 2px 4px)}
.tray{display:flex;align-items:center;gap:6px;border:1px solid;border-color:#000 #fff #fff #000;box-shadow:inset -1px -1px 0 #dfdfdf,inset 1px 1px 0 #808080;padding:2px 8px;font-size:11px;height:24px}
.tray .ico-mini{width:16px;height:16px}
.startmenu{position:fixed;bottom:30px;left:2px;width:230px;background:var(--gray);border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset 1px 1px 0 #dfdfdf,inset -1px -1px 0 #808080,2px 2px 4px rgba(0,0,0,.4);z-index:1100;display:none;flex-direction:row}
.startmenu.show{display:flex}
.startmenu .strip{width:24px;background:linear-gradient(180deg,var(--blue),#3a3aaa);color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:18px;font-weight:700;letter-spacing:1px;padding:8px 0;font-style:italic}
.startmenu .strip span{display:inline-block}
.startmenu ul{flex:1;list-style:none}
.startmenu li{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;cursor:pointer;border-bottom:1px solid #b0b0b0;font-size:12px}
.startmenu li:last-child{border-bottom:none}
.startmenu li:hover{background:var(--hi);color:#fff}
.startmenu li svg{width:24px;height:24px}
.startmenu li.sep{padding:0;border-top:1px solid #fff;border-bottom:1px solid #808080;height:0;margin:0}
.win{position:absolute;background:var(--gray);border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset 1px 1px 0 #dfdfdf,inset -1px -1px 0 #808080,2px 2px 6px rgba(0,0,0,.5);min-width:300px;max-width:580px;width:90vw;display:flex;flex-direction:column}
.titlebar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:3px 4px;display:flex;align-items:center;gap:4px;cursor:move;font-weight:700;font-size:11px;user-select:none}
.titlebar.inactive{background:linear-gradient(90deg,#7a7a7a,#a0a0a0);color:#dfdfdf}
.titlebar .ti{display:flex;align-items:center;gap:4px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titlebar svg{width:14px;height:14px;flex-shrink:0}
.titlebar .btns{display:flex;gap:1px}
.tb-btn{width:16px;height:14px;background:var(--gray);border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset 1px 1px 0 #dfdfdf,inset -1px -1px 0 #808080;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:10px;color:#000;font-family:inherit;line-height:1;font-weight:700;padding:0}
.tb-btn:active{border-color:#000 #fff #fff #000;box-shadow:inset -1px -1px 0 #dfdfdf,inset 1px 1px 0 #808080}
.menubar2{display:flex;gap:0;padding:1px;background:var(--gray);border-bottom:1px solid #808080;font-size:11px}
.menubar2 span{padding:2px 6px;cursor:default}
.menubar2 span:hover{background:var(--hi);color:#fff}
.menubar2 .u{text-decoration:underline}
.win-body{padding:8px 10px 10px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;margin:4px;flex:1;overflow:auto;font-size:12px;line-height:1.45;max-height:64vh}
.win-body p{margin-bottom:6px}
.win-body h3{font-size:13px;margin:6px 0 4px;color:var(--blue)}
.win-body ul{padding-left:20px;margin-bottom:6px}
.win-body a{color:var(--blue)}
.row-ic{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.row-ic svg{width:32px;height:32px;flex-shrink:0}
.divider{border:none;border-top:1px solid #c0c0c0;margin:6px 0;border-bottom:1px solid #fff}
.statusbar{padding:2px 6px;font-size:11px;color:#000;background:var(--gray);border-top:1px solid #fff;display:flex;gap:10px}
.statusbar > span{border:1px solid;border-color:#808080 #fff #fff #808080;padding:1px 6px}
.btn-95{background:var(--gray);border:1px solid;border-color:#fff #000 #000 #fff;box-shadow:inset 1px 1px 0 #dfdfdf,inset -1px -1px 0 #808080;padding:3px 14px;font-size:11px;cursor:pointer;font-family:inherit;margin:4px 4px 0 0}
.btn-95:active{border-color:#000 #fff #fff #000;box-shadow:inset -1px -1px 0 #dfdfdf,inset 1px 1px 0 #808080}
@media (max-width:600px){
  .win{position:fixed!important;left:5vw!important;top:30px!important;width:90vw!important;max-height:calc(100vh - 80px)}
  .dico{position:relative!important;display:inline-flex;left:auto!important;top:auto!important;margin:8px}
  .desktop{display:flex;flex-wrap:wrap;align-items:flex-start;padding:8px}
}
</style>
</head>

  <div class="win" style="width:520px;left:120px;top:60px">

    </div>

<script>
(function(){
  const windows=document.getElementById('windows');
  const tasks=document.getElementById('tasks');
  const startbtn=document.getElementById('startbtn');
  const startmenu=document.getElementById('startmenu');
  let z=10;
  const isTouch=window.matchMedia('(hover:none)').matches || 'ontouchstart' in window;

  function clock(){
    const d=new Date();
    const h=d.getHours()%12||12, m=String(d.getMinutes()).padStart(2,'0');
    const ap=d.getHours()<12?'AM':'PM';
    document.getElementById('tray-clock').textContent=h+':'+m+' '+ap;
  }
  clock(); setInterval(clock,30000);

  function focusWin(node){
    document.querySelectorAll('.titlebar').forEach(t=>t.classList.add('inactive'));
    const tb=node.querySelector('.titlebar');
    if(tb) tb.classList.remove('inactive');
    node.style.zIndex=++z;
    document.querySelectorAll('.task-item').forEach(t=>t.classList.remove('active'));
    const ti=tasks.querySelector('[data-for="'+node.dataset.id+'"]');
    if(ti) ti.classList.add('active');
  }

  function makeTask(node,id,label){
    const t=document.createElement('button');
    t.className='task-item active';
    t.dataset.for=id;
    const span=document.createElement('span');
    span.textContent=label;
    t.appendChild(span);
    t.addEventListener('click',()=>focusWin(node));
    tasks.appendChild(t);
    return t;
  }

  function open(id){
    const existing=windows.querySelector('.win[data-id="'+id+'"]');
    if(existing){ focusWin(existing); return; }
    const tpl=document.getElementById('tpl-'+id);
    if(!tpl) return;
    const node=tpl.content.firstElementChild.cloneNode(true);
    node.dataset.id=id;
    const baseTop=parseInt(node.style.top||'80');
    const baseLeft=parseInt(node.style.left||'120');
    const offset=windows.children.length*20;
    node.style.top=(baseTop+offset)+'px';
    node.style.left=(baseLeft+offset)+'px';
    windows.appendChild(node);
    const label=node.querySelector('.titlebar .ti').textContent.trim();
    const task=makeTask(node,id,label);
    bind(node,task);
    focusWin(node);
  }

  function bind(node,task){
    node.querySelectorAll('.tb-btn.close, .close').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      node.remove();
      task.remove();
    }));
    node.addEventListener('mousedown',()=>focusWin(node),true);
    node.addEventListener('touchstart',()=>focusWin(node),true);
    const tb=node.querySelector('.titlebar');
    let drag=null;
    function start(e){
      const ev=e.touches?e.touches[0]:e;
      const r=node.getBoundingClientRect();
      drag={dx:ev.clientX-r.left,dy:ev.clientY-r.top};
      e.preventDefault();
    }
    function move(e){
      if(!drag)return;
      const ev=e.touches?e.touches[0]:e;
      let nl=ev.clientX-drag.dx, nt=ev.clientY-drag.dy;
      nt=Math.max(0,nt);
      node.style.left=nl+'px';
      node.style.top=nt+'px';
    }
    function end(){drag=null}
    tb.addEventListener('mousedown',start);
    tb.addEventListener('touchstart',start,{passive:false});
    document.addEventListener('mousemove',move);
    document.addEventListener('touchmove',move,{passive:false});
    document.addEventListener('mouseup',end);
    document.addEventListener('touchend',end);
  }

  function bindIcons(){
    document.querySelectorAll('.dico').forEach(el=>{
      const open_=()=>open(el.dataset.win);
      el.addEventListener('dblclick',open_);
      if(isTouch) el.addEventListener('click',open_);
      else el.addEventListener('click',()=>{
        document.querySelectorAll('.dico').forEach(x=>x.classList.remove('sel'));
        el.classList.add('sel');
      });
    });
  }
  bindIcons();

  startbtn.addEventListener('click',e=>{
    e.stopPropagation();
    startmenu.classList.toggle('show');
    startbtn.classList.toggle('open');
  });
  document.addEventListener('click',()=>{startmenu.classList.remove('show');startbtn.classList.remove('open');});
  startmenu.addEventListener('click',e=>e.stopPropagation());
  startmenu.querySelectorAll('li[data-win]').forEach(li=>li.addEventListener('click',()=>{
    open(li.dataset.win);
    startmenu.classList.remove('show');
    startbtn.classList.remove('open');
  }));
  open('readme');
})();
</script>
</body>
</html>
